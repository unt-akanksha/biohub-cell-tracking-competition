[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-tracker"
version = "0.1.0"
description = "Offline-first competition control plane for the Biohub Kaggle challenge"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
evaluation = [
    "polars==1.43.2",
    "scipy==1.18.1",
    "tracksdata @ git+https://github.com/royerlab/tracksdata@39dccf3a243e44274759468cb31b2ad9e7fc1d09",
]

[project.scripts]
biohub = "biohub_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
